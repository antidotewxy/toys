<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150c09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>掷筊 · 请示</title>
<style>
  :root {
    --gold: #d8b25e;
    --cream: #f6ead2;
    --font: "Kaiti SC", "KaiTi", "STKaiti", "楷体", "Songti SC", "Noto Serif SC", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); color: var(--cream);
    background:
      radial-gradient(120% 70% at 50% -10%, #3a2118 0%, #241509 45%, #150c09 100%),
      #150c09;
    display: flex; align-items: center; justify-content: center;
    padding: calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left));
    overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  .app {
    width: 100%; max-width: 560px; max-height: 100%;
    display: flex; flex-direction: column; gap: 0;
    background: radial-gradient(120% 80% at 50% 0%, #2b1912 0%, #1c110d 56%, #150c09 100%);
    border: 1px solid rgba(216,178,94,.32); border-radius: 20px;
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 40px 90px -40px #000, 0 0 0 1px rgba(255,226,170,.05) inset;
    animation: enter .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
  .seal {
    width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 34% 28%, #f2db9f, #c08a35 60%, #7c5416);
    box-shadow: 0 0 0 1px rgba(255,236,190,.28) inset, 0 8px 18px -12px rgba(216,178,94,.95);
  }
  .title { font-size: 17px; font-weight: 700; letter-spacing: 4px; color: #f8eeda; line-height: 1.2; }
  .sub { margin-top: 3px; font-size: 11px; letter-spacing: 2px; color: rgba(246,234,210,.42); }
  .head-actions { margin-left: auto; display: flex; gap: 6px; }
  .icon {
    width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; padding: 0;
    border-radius: 9px; border: 1px solid rgba(216,178,94,.2);
    background: rgba(255,240,210,.045); color: rgba(246,234,210,.7);
    font-family: inherit; font-size: 13px; line-height: 1;
  }
  .icon:hover { background: rgba(255,240,210,.12); color: #f8eeda; }

  .stage {
    position: relative; height: 212px; margin: 4px 18px 0; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(216,178,94,.16);
    background: radial-gradient(72% 84% at 50% 24%, rgba(152,94,46,.55) 0%, rgba(58,32,20,.78) 48%, rgba(23,13,10,.97) 100%);
    box-shadow: inset 0 18px 36px -24px #000;
  }
  .stage::before {
    content: ''; position: absolute; left: 50%; top: -46%; width: 210px; height: 190%;
    transform: translateX(-50%); pointer-events: none;
    background: linear-gradient(180deg, rgba(255,214,150,.11), transparent 62%); filter: blur(9px);
  }
  .stage::after {
    content: ''; position: absolute; inset: auto 0 0 0; height: 50px; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.45));
  }
  .dice { position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); display: flex; gap: 20px; }
  .slot { position: relative; width: 148px; height: 84px; }
  .shadow {
    position: absolute; left: 50%; bottom: -22px; width: 178px; height: 28px;
    transform: translateX(-50%); opacity: .8;
    background: radial-gradient(closest-side, rgba(0,0,0,.66), rgba(0,0,0,0) 74%);
  }
  .shadow.drop { animation: drop 860ms cubic-bezier(.3,.6,.3,1) both; }
  .persp { position: absolute; inset: 0; perspective: 680px; }
  .die { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .back { transform: rotateX(180deg); }
  .tumbling { animation: tumble 800ms cubic-bezier(.28,.62,.24,1) both; }

  @keyframes tumble {
    0%   { transform: translate3d(0,0,0) rotateX(var(--from)) rotateZ(0deg); }
    22%  { transform: translate3d(calc(var(--dx) * .35), -20px, 0) rotateX(calc(var(--from) + var(--spin) * .16)) rotateZ(-7deg); }
    50%  { transform: translate3d(var(--dx), -112px, 0) rotateX(calc(var(--from) + var(--spin) * .56)) rotateZ(9deg); }
    74%  { transform: translate3d(calc(var(--dx) * .62), 10px, 0) rotateX(calc(var(--from) + var(--spin) * .9)) rotateZ(-4deg); }
    86%  { transform: translate3d(calc(var(--dx) * .42), -14px, 0) rotateX(calc(var(--from) + var(--spin) * .97)) rotateZ(2deg); }
    100% { transform: translate3d(0,0,0) rotateX(calc(var(--from) + var(--spin))) rotateZ(0deg); }
  }
  @keyframes drop {
    0%   { transform: translateX(-50%) scale(1); opacity: .8; }
    50%  { transform: translateX(-50%) scale(.46); opacity: .2; }
    74%  { transform: translateX(-50%) scale(1.05); opacity: .72; }
    86%  { transform: translateX(-50%) scale(.82); opacity: .5; }
    100% { transform: translateX(-50%) scale(1); opacity: .8; }
  }

  .verdict {
    position: relative; min-height: 118px; padding: 16px 22px 6px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  }
  .verdict.pop { animation: pop .34s ease-out both; }
  .halo {
    position: absolute; left: 50%; top: 8px; width: 210px; height: 100px; transform: translateX(-50%);
    pointer-events: none; animation: breathe 3.2s ease-in-out infinite;
  }
  .name { position: relative; font-size: 34px; font-weight: 700; letter-spacing: 10px; text-indent: 10px; line-height: 1.1; }
  .name.waiting { font-size: 21px; letter-spacing: 6px; text-indent: 6px; color: rgba(246,234,210,.42); }
  .tag { position: relative; font-size: 11px; letter-spacing: 2.4px; color: rgba(246,234,210,.46); }
  .gloss { position: relative; margin-top: 3px; max-width: 400px; font-size: 13.5px; line-height: 1.75; color: rgba(246,234,210,.8); }
  .gloss b { color: rgba(255,226,170,.92); }
  .asked { position: relative; margin-top: 2px; max-width: 400px; font-size: 11px; letter-spacing: .5px;
    color: rgba(246,234,210,.36); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field { padding: 6px 18px 0; }
  textarea {
    width: 100%; min-height: 58px; max-height: 92px; resize: none; outline: none;
    padding: 10px 12px; border-radius: 11px; font-family: inherit; font-size: 13.5px; line-height: 1.7;
    color: var(--cream); background: rgba(255,240,210,.045); border: 1px solid rgba(216,178,94,.2);
  }
  textarea::placeholder { color: rgba(246,234,210,.26); }
  textarea:focus { border-color: rgba(216,178,94,.48); background: rgba(255,240,210,.07); }

  .toss {
    margin: 12px 18px 0; height: 48px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 9px; text-indent: 9px;
    color: #2b1808; border: 1px solid rgba(255,238,196,.45);
    background: linear-gradient(180deg, #eed089 0%, #d5ab57 46%, #b1802f 100%);
    box-shadow: 0 14px 28px -16px rgba(216,178,94,.95), inset 0 1px 0 rgba(255,250,230,.6);
    transition: filter .15s ease, transform .12s ease;
  }
  .toss:hover { filter: brightness(1.07); }
  .toss:active { transform: translateY(1px); }
  .toss[disabled] { cursor: default; filter: saturate(.65) brightness(.85); }

  .stats { display: flex; align-items: center; gap: 13px; padding: 13px 20px 0; font-size: 12px; color: rgba(246,234,210,.5); }
  .dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; }
  .streak { margin-left: auto; color: #e8c267; letter-spacing: 1px; font-size: 12px; }
  .history { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; min-height: 24px; }
  .chip {
    width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px;
    font-size: 12.5px; border: 1px solid currentColor; background: rgba(255,240,210,.045);
  }
  .empty { font-size: 12px; letter-spacing: 1.4px; color: rgba(246,234,210,.28); }
  .foot { padding: 14px 20px 16px; font-size: 11px; letter-spacing: 1.6px; text-align: center; color: rgba(246,234,210,.3); }

  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: translateX(-50%) scale(1); }
    50%      { opacity: .95; transform: translateX(-50%) scale(1.07); }
  }
  @media (max-height: 760px) {
    .stage { height: 158px; }
    .slot { width: 104px; height: 60px; }
    .name { font-size: 29px; }
    .verdict { min-height: 100px; }
    .toss { height: 44px; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div class="seal">
      <svg viewBox="0 0 116 64" width="24" height="13" aria-hidden="true">
        <path d="M8 52 C20 12 96 12 108 52 C88 32 24 32 8 52 Z" fill="#3a240f" stroke="rgba(58,36,15,.4)" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="title">掷筊 · 请示</div>
      <div class="sub" id="sub">心诚则灵 · 一掷一问</div>
    </div>
    <div class="head-actions">
      <button class="icon" id="mute" title="关闭木杯声" aria-label="声音">🔊</button>
      <button class="icon" id="reset" title="清空杯迹" aria-label="清空">⟲</button>
    </div>
  </div>

  <div class="stage">
    <div class="dice" id="dice">
      <div class="slot">
        <div class="shadow"></div>
        <div class="persp">
          <div class="die" style="transform: rotateX(0deg)">
            <div class="face">
              <svg viewBox="0 0 116 64" width="100%" height="100%" style="overflow:visible" aria-hidden="true">
                <defs>
                  <linearGradient id="fxFlat" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fdf7e9"/><stop offset="54%" stop-color="#f0dfbe"/><stop offset="100%" stop-color="#d3b688"/>
                  </linearGradient>
                </defs>
                <path d="M8 52 C20 12 96 12 108 52 C88 32 24 32 8 52 Z" fill="url(#fxFlat)" stroke="#7a5730" stroke-width="1.1" stroke-linejoin="round"/>
                <path d="M20 44 C30 22 86 22 96 44" fill="none" stroke="rgba(255,255,255,.66)" stroke-width="1.1"/>
                <path d="M28 42 C36 27 80 27 88 42" fill="none" stroke="rgba(122,87,48,.22)" stroke-width="1"/>
                <path d="M46 29 C54 26 66 26 74 29" fill="none" stroke="rgba(122,87,48,.14)" stroke-width="1"/>
              </svg>
            </div>
            <div class="face back">
              <svg viewBox="0 0 116 64" width="100%" height="100%" style="overflow:visible" aria-hidden="true">
                <defs>
                  <radialGradient id="fxRound" cx="38%" cy="22%" r="88%">
                    <stop offset="0%" stop-color="#e5684c"/><stop offset="46%" stop-color="#b83c27"/><stop offset="100%" stop-color="#6d1a0f"/>
                  </radialGradient>
                  <filter id="fxSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
                </defs>
                <path d="M8 52 C20 12 96 12 108 52 C88 32 24 32 8 52 Z" fill="url(#fxRound)" stroke="#4a1208" stroke-width="1.1" stroke-linejoin="round"/>
                <path d="M24 43 C34 24 74 21 90 33" fill="none" stroke="rgba(255,231,192,.58)" stroke-width="3" stroke-linecap="round" filter="url(#fxSoft)"/>
                <path d="M14 51 C32 35 84 35 102 51" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2.4" filter="url(#fxSoft)"/>
                <path d="M32 24 C42 17 62 15 76 20" fill="none" stroke="rgba(255,246,232,.35)" stroke-width="1.4" stroke-linecap="round" filter="url(#fxSoft)"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div class="slot">
        <div class="shadow"></div>
        <div class="persp">
          <div class="die" style="transform: rotateX(180deg)">
            <div class="face">
              <svg viewBox="0 0 116 64" width="100%" height="100%" style="overflow:visible" aria-hidden="true">
                <defs>
                  <linearGradient id="fxFlat2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fdf7e9"/><stop offset="54%" stop-color="#f0dfbe"/><stop offset="100%" stop-color="#d3b688"/>
                  </linearGradient>
                </defs>
                <path d="M8 52 C20 12 96 12 108 52 C88 32 24 32 8 52 Z" fill="url(#fxFlat2)" stroke="#7a5730" stroke-width="1.1" stroke-linejoin="round"/>
                <path d="M20 44 C30 22 86 22 96 44" fill="none" stroke="rgba(255,255,255,.66)" stroke-width="1.1"/>
                <path d="M28 42 C36 27 80 27 88 42" fill="none" stroke="rgba(122,87,48,.22)" stroke-width="1"/>
                <path d="M46 29 C54 26 66 26 74 29" fill="none" stroke="rgba(122,87,48,.14)" stroke-width="1"/>
              </svg>
            </div>
            <div class="face back">
              <svg viewBox="0 0 116 64" width="100%" height="100%" style="overflow:visible" aria-hidden="true">
                <defs>
                  <radialGradient id="fxRound2" cx="38%" cy="22%" r="88%">
                    <stop offset="0%" stop-color="#e5684c"/><stop offset="46%" stop-color="#b83c27"/><stop offset="100%" stop-color="#6d1a0f"/>
                  </radialGradient>
                  <filter id="fxSoft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
                </defs>
                <path d="M8 52 C20 12 96 12 108 52 C88 32 24 32 8 52 Z" fill="url(#fxRound2)" stroke="#4a1208" stroke-width="1.1" stroke-linejoin="round"/>
                <path d="M24 43 C34 24 74 21 90 33" fill="none" stroke="rgba(255,231,192,.58)" stroke-width="3" stroke-linecap="round" filter="url(#fxSoft2)"/>
                <path d="M14 51 C32 35 84 35 102 51" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2.4" filter="url(#fxSoft2)"/>
                <path d="M32 24 C42 17 62 15 76 20" fill="none" stroke="rgba(255,246,232,.35)" stroke-width="1.4" stroke-linecap="round" filter="url(#fxSoft2)"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="verdict pop" id="verdict">
    <div class="name waiting">静候一问</div>
    <div class="tag">默念所求 · 掷杯问神</div>
  </section>

  <div class="field">
    <textarea id="ask" rows="2" maxlength="60" placeholder="心中所求（可不填）…" spellcheck="false"></textarea>
  </div>

  <button class="toss" id="toss">掷 杯</button>

  <div class="stats">
    <span><i class="dot" style="background:#e8c267"></i>圣杯 <b id="c-sheng">0</b></span>
    <span><i class="dot" style="background:#e6a86a"></i>笑杯 <b id="c-xiao">0</b></span>
    <span><i class="dot" style="background:#c19a95"></i>阴杯 <b id="c-yin">0</b></span>
    <span class="streak" id="streak"></span>
  </div>

  <div class="history" id="history"><span class="empty">尚无杯迹</span></div>
  <div class="foot" id="foot">连掷三次为定 · 三圣杯为大吉<span id="kbd"> · 空格键再掷</span></div>
</main>

<script>
(function () {
  'use strict'

  var KINDS = {
    sheng: { name: '圣杯', mark: '圣', tag: '一平一凸 · 阴阳相合', title: '神明允准', body: '所问之事可行。放心去做，自有护佑。', color: '#e8c267', halo: 'rgba(232,194,103,.55)' },
    xiao:  { name: '笑杯', mark: '笑', tag: '两平面朝上 · 神明含笑', title: '笑而不答', body: '所问或未说清，或时机未到。把心思理一理，再问一次。', color: '#e6a86a', halo: 'rgba(230,168,106,.45)' },
    yin:   { name: '阴杯', mark: '阴', tag: '两凸面朝上 · 神明未允', title: '暂未应允', body: '此事此刻不宜。可换个问法，或另择时机。', color: '#c19a95', halo: 'rgba(193,154,149,.4)' }
  }
  var ORDER = ['sheng', 'xiao', 'yin']
  var KEY = 'dsh.jiaobei.standalone.v1'

  var $ = function (id) { return document.getElementById(id) }
  var dice = Array.prototype.slice.call(document.querySelectorAll('.die'))
  var shadows = Array.prototype.slice.call(document.querySelectorAll('.shadow'))
  var verdict = $('verdict')
  var ask = $('ask')
  var tossBtn = $('toss')
  var historyEl = $('history')
  var streakEl = $('streak')

  var faces = [0, 1]
  var rolling = false
  var history = []
  var muted = false
  var timer = 0

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY)
      if (!raw) return
      var data = JSON.parse(raw)
      if (data && Array.isArray(data.h)) {
        history = data.h.filter(function (e) { return e && KINDS[e.k] }).slice(0, 60)
      }
      muted = !!(data && data.muted)
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ h: history.slice(0, 60), muted: muted })) } catch (e) {}
  }

  /* ---------- sound ---------- */
  var ctx = null
  function primeAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext
      if (!Ctx) return
      if (!ctx) ctx = new Ctx()
      if (ctx.state === 'suspended') ctx.resume()
    } catch (e) {}
  }
  function clack(volume) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext
      if (!Ctx) return
      if (!ctx) ctx = new Ctx()
      if (ctx.state === 'suspended') ctx.resume()
      var now = ctx.currentTime
      var len = Math.max(1, Math.floor(ctx.sampleRate * 0.1))
      var buf = ctx.createBuffer(1, len, ctx.sampleRate)
      var data = buf.getChannelData(0)
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 7)
      var noise = ctx.createBufferSource(); noise.buffer = buf
      var band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1750; band.Q.value = 0.85
      var g = ctx.createGain(); g.gain.value = volume
      noise.connect(band); band.connect(g); g.connect(ctx.destination); noise.start(now)

      var osc = ctx.createOscillator(); osc.type = 'triangle'
      osc.frequency.setValueAtTime(230, now)
      osc.frequency.exponentialRampToValueAtTime(88, now + 0.1)
      var og = ctx.createGain()
      og.gain.setValueAtTime(volume * 0.9, now)
      og.gain.exponentialRampToValueAtTime(0.0008, now + 0.13)
      osc.connect(og); og.connect(ctx.destination); osc.start(now); osc.stop(now + 0.15)
    } catch (e) {}
  }

  /* ---------- dice ---------- */
  function kindOf(f) {
    var flats = (f[0] === 0 ? 1 : 0) + (f[1] === 0 ? 1 : 0)
    return flats === 2 ? 'xiao' : flats === 1 ? 'sheng' : 'yin'
  }

  function toss() {
    if (rolling) return
    primeAudio()
    rolling = true
    var next = [Math.random() < 0.5 ? 0 : 1, Math.random() < 0.5 ? 0 : 1]
    var kind = kindOf(next)
    var from = faces.slice()

    dice.forEach(function (die, i) {
      var fromAngle = from[i] * 180
      var toAngle = next[i] * 180
      die.style.setProperty('--from', fromAngle + 'deg')
      die.style.setProperty('--spin', (1080 + (toAngle - fromAngle)) + 'deg')
      die.style.setProperty('--dx', i === 0 ? '-9px' : '11px')
      die.style.transform = 'rotateX(' + toAngle + 'deg)'
      die.style.animationDelay = (i * 60) + 'ms'
      die.classList.remove('tumbling')
      void die.offsetWidth
      die.classList.add('tumbling')

      var sh = shadows[i]
      sh.classList.remove('drop')
      void sh.offsetWidth
      sh.classList.add('drop')
      sh.style.animationDelay = (i * 60) + 'ms'
    })

    tossBtn.disabled = true
    tossBtn.textContent = '掷 出 中'
    verdict.className = 'verdict'
    verdict.innerHTML = '<div class="name waiting">…</div><div class="tag">杯在半空</div>'

    clearTimeout(timer)
    timer = setTimeout(function () {
      dice.forEach(function (die) {
        die.classList.remove('tumbling')
        die.style.animationDelay = '0ms'
      })
      shadows.forEach(function (sh) {
        sh.classList.remove('drop')
        sh.style.animationDelay = '0ms'
      })
      faces = next
      rolling = false
      tossBtn.disabled = false
      tossBtn.textContent = '掷 杯'
      show(kind)
      history.unshift({ k: kind, t: Date.now(), q: ask.value.trim().slice(0, 60) })
      history = history.slice(0, 60)
      save()
      renderHistory()
      if (!muted) { clack(0.15); setTimeout(function () { clack(0.09) }, 60) }
    }, 900)
  }

  function show(kind) {
    var K = KINDS[kind]
    var question = ask.value.trim().slice(0, 60)
    verdict.className = 'verdict'
    verdict.innerHTML =
      '<div class="halo" style="background:radial-gradient(closest-side,' + K.halo + ',transparent 72%)"></div>' +
      '<div class="name" style="color:' + K.color + '">' + K.name + '</div>' +
      '<div class="tag">' + K.tag + '</div>' +
      '<div class="gloss"><b>' + K.title + ' · </b>' + K.body + '</div>' +
      (question ? '<div class="asked">所问：' + escapeHtml(question) + '</div>' : '')
    void verdict.offsetWidth
    verdict.classList.add('pop')
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  function renderHistory() {
    var counts = { sheng: 0, xiao: 0, yin: 0 }
    history.forEach(function (e) { counts[e.k]++ })
    ORDER.forEach(function (k) {
      var el = $('c-' + k)
      if (el) el.textContent = counts[k]
    })
    var streak = 0
    for (var i = 0; i < history.length; i++) {
      if (history[i].k !== 'sheng') break
      streak++
    }
    streakEl.textContent = streak >= 2 ? '连得 ' + streak + ' 圣' : ''

    if (!history.length) {
      historyEl.innerHTML = '<span class="empty">尚无杯迹</span>'
      return
    }
    historyEl.innerHTML = history.slice(0, 14).map(function (e) {
      var K = KINDS[e.k]
      var time = new Date(e.t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      var title = K.name + ' · ' + time + (e.q ? ' · ' + e.q : '')
      return '<span class="chip" style="color:' + K.color + '" title="' + escapeHtml(title) + '">' + K.mark + '</span>'
    }).join('')
  }

  /* ---------- wiring ---------- */
  tossBtn.addEventListener('click', toss)
  $('mute').addEventListener('click', function () {
    muted = !muted
    $('mute').textContent = muted ? '🔇' : '🔊'
    $('mute').title = muted ? '开启木杯声' : '关闭木杯声'
    save()
  })
  $('reset').addEventListener('click', function () {
    history = []
    save()
    renderHistory()
  })
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' && e.key !== ' ') return
    if (e.target === ask) return
    e.preventDefault()
    toss()
  })

  load()
  $('mute').textContent = muted ? '🔇' : '🔊'
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    var kbd = document.getElementById('kbd')
    if (kbd) kbd.style.display = 'none'
  }
  renderHistory()
  // First pose matches the two starting faces (flat / round) already in the markup.
})()
</script>
</body>
</html>
